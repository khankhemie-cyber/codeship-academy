name: CI

on:
  push:
    branches: [main, "claude/**", "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Stub values so Next.js build doesn't fail on missing env vars
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_APP_URL: https://app.codeshipacademy.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRICE_MONTHLY: price_placeholder
          STRIPE_PRICE_ANNUAL: price_placeholder
          STRIPE_PRICE_FAMILY: price_placeholder
          STRIPE_PRICE_TEACHER: price_placeholder
          STRIPE_PRICE_SESSIONS_5: price_placeholder
          STRIPE_PRICE_SESSIONS_10: price_placeholder
          STRIPE_PRICE_SESSIONS_20: price_placeholder
          STRIPE_PRICE_SCHOOL_MONTHLY: price_placeholder
          STRIPE_PRICE_SCHOOL_ANNUAL: price_placeholder
          RESEND_API_KEY: re_placeholder
          EMAIL_FROM: noreply@codeshipacademy.com
          CRON_SECRET: placeholder
